services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      DEVICE: cpu
    ports: ["8001:8001"]
    volumes:
      - ./data:/data
      - ./models:/models   # pesos de YOLO26 (se descargan solos al primer uso)

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      AI_SERVICE_URL: http://ai-service:8001
      DATA_DIR: /data
      FRONTEND_DIR: /srv/frontend
    ports: ["8000:8000"]
    volumes:
      - ./data:/data
      - ./frontend:/srv/frontend:ro
    depends_on:
      mongo: { condition: service_healthy }
      ai-service: { condition: service_started }

volumes:
  mongo_data:
